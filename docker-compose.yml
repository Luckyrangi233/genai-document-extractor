version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documents
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
  audit-ui:
    build: .
    command: streamlit run ui/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  pgdata:
